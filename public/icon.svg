<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23211D" />
      <stop offset="100%" stop-color="#121210" />
    </linearGradient>
  </defs>

  <!-- Dark Ink Squircle Frame -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#inkGrad)" stroke="#383630" stroke-width="12" />
  
  <!-- Subtle Editorial Dotted Rim -->
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#F3F0E8" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="14 10" />

  <!-- Bold Serif "U" Monogram -->
  <text
    x="236"
    y="368"
    font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
    font-size="330"
    font-weight="900"
    fill="#FFFDF7"
    text-anchor="middle"
    letter-spacing="-6"
  >U</text>

  <!-- Editorial Red Accent Marker Dot -->
  <circle cx="368" cy="148" r="34" fill="#D94A38" />
  <circle cx="368" cy="148" r="15" fill="#F7E84B" />
</svg>
